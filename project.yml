name: CanopyKitDemo
options:
  bundleIdPrefix: com.wuhu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
packages:
  CanopyKit:
    path: .
targets:
  CanopyKitDemo:
    type: application
    platform: macOS
    sources:
      - path: Demo
        excludes:
          - Package.swift
    dependencies:
      - package: CanopyKit
        product: CanopyKit
    settings:
      INFOPLIST_KEY_NSMainStoryboardFile: ""
      INFOPLIST_KEY_NSPrincipalClass: NSApplication
      GENERATE_INFOPLIST_FILE: true
