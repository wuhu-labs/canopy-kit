name: WuhuUIDemo
options:
  bundleIdPrefix: com.wuhu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
packages:
  WuhuUI:
    path: .
targets:
  WuhuUIDemo:
    type: application
    platform: macOS
    sources:
      - path: Demo
    dependencies:
      - package: WuhuUI
    settings:
      INFOPLIST_KEY_NSMainStoryboardFile: ""
      INFOPLIST_KEY_NSPrincipalClass: NSApplication
      GENERATE_INFOPLIST_FILE: true
